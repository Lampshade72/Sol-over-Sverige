RULE_OPTION_SWE_ELECTION_REVOLUTION_LINDHOLM_DESC:0 "After the failed military coup d'etat, the fanatical coalition between Flyg’s national syndicalists and Linderots Communists win, with Linderot being chosen as their leader. He soon uses Sven Lindholm to eradicate Flyg and his henchmen, allowing Lindholm time to coup Linderot, establishing his own vision for Sweden."
